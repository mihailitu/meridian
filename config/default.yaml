gateway:
  adapter: alpaca  # mock | ibkr | alpaca | yahoo

  mock:
    tick_interval_ms: 500
    volatility: 0.001

  ibkr:
    host: "127.0.0.1"
    port: 7497
    client_id: 1

  alpaca:
    api_key: ""  # Use ALPACA_API_KEY env var
    secret_key: ""  # Use ALPACA_SECRET_KEY env var
    feed: "iex"  # "iex" (free) or "sip" (paid)
    paper: true

  yahoo:
    poll_interval_ms: 5000  # Polling interval (no streaming available)

  symbols:
    - symbol: AAPL
      base_price: 185.00
    - symbol: MSFT
      base_price: 420.00
    - symbol: GOOGL
      base_price: 175.00
    - symbol: AMZN
      base_price: 185.00
    - symbol: NVDA
      base_price: 880.00

  # Seconds since the last received tick before the watchdog logs a warning
  # (covers all adapters). 0 disables.
  tick_staleness_seconds: 300

redis:
  host: "localhost"
  port: 6380
  stream_prefix: "stream:ticks"
  # Approximate cap per stream (XADD MAXLEN ~), 0 = unlimited.
  stream_maxlen: 100000
  # Consumer group creation start id. "$" = new messages only on group
  # creation; fulltest pins "0" so replay never misses early ticks.
  consumer_group_start: "$"

aggregator:
  intervals:
    - "1m"
    - "5m"
  source_stream: "stream:ticks:us"
  consumer_group: "aggregator"
  bar_stream_prefix: "stream:bars"

database:
  host: "localhost"
  port: 5433
  database: "axtrade"
  user: "axtrade"
  password: "axtrade"
  min_pool_size: 2
  max_pool_size: 10

indicators:
  sma_period: 20
  rsi_period: 14
  regime:
    sma_short_period: 10
    sma_long_period: 20
    volatility_lookback: 20
    atr_period: 14

oms:
  paper_mode: true
  slippage_bps: 10
  max_positions: 20
  # Reject paper orders larger than this fraction of the symbol's last bar volume (0 = disabled). Audit C3.
  max_volume_participation: 0.0
  commission:
    per_share: 0.005    # IBKR Pro Fixed: $0.005/share
    minimum: 1.00       # Min $1.00 per order
    max_pct: 1.0        # Max 1% of trade value
  risk:
    max_position_size: 1000
    max_position_value: 50000
    max_order_size: 500
    max_daily_loss: 1000
    max_open_orders: 10

strategies:
  bar_stream: "stream:bars:1m:us"
  consumer_group: "strategies"
  control_channel: "axtrade:strategy:control"
  enabled:
    - type: momentum
      id: momentum_us_01
      # DEAD (phase 3): 0 trades IS and OOS — gates never co-fire. See ROADMAP per-strategy table.
      enabled: false
      config:
        # Keys must match what MomentumBreakout reads: entry fires when RSI
        # crosses up through rsi_cross_level (a previous `rsi_oversold` key
        # here was silently ignored by the strategy).
        rsi_cross_level: 50
        rsi_overbought: 70
        trend_strength_min: 30.0
        stop_loss_pct: 0.02
        position_size: 100

    - type: mean_reversion
      id: mean_rev_01
      # DEAD (phase 3): IS PF 0.40 / OOS PF 0.36. See ROADMAP per-strategy table.
      enabled: false
      # bb_period/bb_std now configured at indicators-level (single source
      # of truth); strategy reads bands from BarWithIndicators.
      config:
        rsi_oversold: 35
        rsi_overbought: 70
        stop_loss_pct: 0.02
        position_size: 100

    - type: multi_timeframe
      id: mtf_01
      # DEAD (phase 3): IS PF 0.21 / OOS PF 0.21. See ROADMAP per-strategy table.
      enabled: false
      config:
        trend_period: 20
        trend_interval_minutes: 5
        rsi_oversold: 40
        rsi_overbought: 60
        stop_loss_pct: 0.015
        take_profit_pct: 0.03
        position_size: 100

    - type: pairs
      id: pairs_aapl_msft
      # DEAD (phase 3): IS PF 0.06 / OOS PF 0.01. See ROADMAP per-strategy table.
      enabled: false
      config:
        symbol_a: AAPL
        symbol_b: MSFT
        lookback: 20
        entry_zscore: 2.0
        exit_zscore: 0.5
        stop_loss_pct: 0.03
        position_size: 50

    - type: discovery_momentum
      id: discovery_momentum_01
      # DEAD (phase 3): IS PF 0.42 / OOS PF 0.45. See ROADMAP per-strategy table.
      enabled: false
      config:
        min_score: 60
        position_size: 50
        stop_loss_pct: 0.03
        score_decay_exit: 30
        max_positions: 10

api:
  host: "127.0.0.1"  # loopback only — put auth in front (api_key) before binding wider
  port: 8000
  api_key: ""  # empty disables auth; prefer setting AXTRADE_API_KEY in .env over committing a key here
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

discovery:
  enabled: true
  scan_interval_seconds: 300
  bar_limit: 50
  interval: "1m"
  auto_subscribe: false
  min_score: 60
  max_positions: 10
  control_channel: "axtrade:discovery:control"
  screeners:
    - type: momentum
      name: momentum_screener
      enabled: true
      params:
        rsi_oversold: 30
        rsi_overbought: 70
        min_bars: 20

    - type: volatility
      name: volatility_screener
      enabled: true
      params:
        min_atr_ratio: 2.0
        min_bars: 20

    - type: volume
      name: volume_screener
      enabled: true
      params:
        volume_multiplier: 2.0
        min_bars: 20

    - type: trend
      name: trend_screener
      enabled: true
      params:
        min_trend_strength: 50
        min_bars: 25
