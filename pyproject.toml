[project]
name = "axtrade"
version = "0.1.0"
description = "Algorithmic trading platform"
requires-python = ">=3.11"
dependencies = [
    "ib_insync>=0.9.86",
    "alpaca-py>=0.21.0",
    "yfinance>=0.2.40",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
