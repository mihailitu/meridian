services:
  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    ports:
      - "8113:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: meridian-timescaledb
    environment:
      POSTGRES_USER: axtrade
      POSTGRES_PASSWORD: axtrade
      POSTGRES_DB: axtrade
    ports:
      - "8112:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axtrade -d axtrade"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  timescale_data:
