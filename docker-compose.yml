services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: axtrade
      POSTGRES_PASSWORD: axtrade
      POSTGRES_DB: axtrade
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      # NOTE: docker-entrypoint-initdb.d scripts only run on FIRST
      # initialization of an empty data volume. Existing dev volumes are
      # unaffected by adding this — they were already migrated via
      # scripts/setup.sh's run_migrations step.
      - ./scripts/init-migrations.sh:/docker-entrypoint-initdb.d/02-migrations.sh
      - ./scripts/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axtrade -d axtrade"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  timescale_data:
